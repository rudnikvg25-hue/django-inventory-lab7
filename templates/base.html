<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Персональний Блог{% endblock %}</title>
    <style>
        /* Основний фон та шрифти */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #eef2f5;
            color: #2c3e50;
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        /* Шапка та навігація */
        header {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            padding: 20px 0;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .nav-container {
            max-width: 1000px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: #ffffff;
            text-decoration: none;
        }

        nav a {
            color: #ffffff;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 600;
            transition: color 0.3s;
        }

        nav a:hover {
            color: #f1c40f;
        }

        /* Основний контейнер */
        .main-container {
            max-width: 1000px;
            margin: 30px auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        /* Картки публікацій */
        .post-card {
            border: 1px solid #e1e8ed;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 25px;
            background: #ffffff;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .post-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .post-title {
            margin-top: 0;
            color: #1e3c72;
        }

        .post-title a {
            color: inherit;
            text-decoration: none;
        }

        .post-meta {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 15px;
        }

        /* Оформлення зображень */
        .post-img {
            max-width: 100%;
            height: auto;
            max-height: 400px;
            border-radius: 8px;
            object-fit: cover;
            display: block;
            margin: 15px 0;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* Кнопки та посилання */
        .btn {
            display: inline-block;
            padding: 10px 18px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 600;
            transition: background-color 0.3s;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        .btn-secondary {
            background-color: #7f8c8d;
        }

        .btn-secondary:hover {
            background-color: #95a5a6;
        }

        /* Футер */
        footer {
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            color: #7f8c8d;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header>
        <div class="nav-container">
            <a href="{% url 'home' %}" class="logo">⚙️ Система Обліку та Блог</a>
            <nav>
                <a href="{% url 'home' %}">Головна</a>
                <a href="{% url 'post_list' %}">Публікації</a>
                <a href="/admin/" target="_blank">Адмінка</a>
            </nav>
        </div>
    </header>

    <div class="main-container">
        {% block content %}
        {% endblock %}
    </div>

    <footer>
        <p>&copy; 2026 Персональний блог. Лабораторна робота №10.</p>
    </footer>
</body>
</html>
