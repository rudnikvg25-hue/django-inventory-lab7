<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Облік та Блог{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; color: #333; }
        nav { background-color: #2c3e50; padding: 15px; border-radius: 5px; margin-bottom: 20px; }
        nav a { color: #ecf0f1; margin-right: 20px; text-decoration: none; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 900px; margin: auto; background: white; padding: 20px; border-radius: 5px; }
        .card { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        .btn-back { display: inline-block; margin-bottom: 15px; padding: 8px 12px; background: #3498db; color: white; text-decoration: none; border-radius: 4px; }
        .post-img { max-width: 100%; height: auto; border-radius: 5px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="{% url 'home' %}">Головна</a>
            <a href="{% url 'post_list' %}">Публікації блогу</a>
        </nav>
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
